name: shopsphere
description: "ShopSphere - a clean-architecture Flutter shopping app on DummyJSON."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^18.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  stream_transform: ^2.1.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FCF8FF"
  color_dark: "#131318"
  image: assets/icon/splash.png
  android_12:
    image: assets/icon/splash.png
    color: "#FCF8FF"
    color_dark: "#131318"
