name: shopsphere
description: "ShopSphere - a clean-architecture Flutter shopping app on DummyJSON."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  go_router: ^18.1.0
  cached_network_image: ^4.0.4
  shimmer: ^4.0.0
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
